<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- trunk -->
    <line x1="50" y1="82" x2="50" y2="55"/>
    <!-- main left branch -->
    <line x1="50" y1="65" x2="30" y2="50"/>
    <!-- main right branch -->
    <line x1="50" y1="65" x2="70" y2="50"/>
    <!-- far left branch -->
    <line x1="30" y1="50" x2="18" y2="36"/>
    <!-- left-center branch -->
    <line x1="30" y1="50" x2="38" y2="33"/>
    <!-- right-center branch -->
    <line x1="70" y1="50" x2="62" y2="33"/>
    <!-- far right branch -->
    <line x1="70" y1="50" x2="82" y2="36"/>
    <!-- center top -->
    <line x1="50" y1="55" x2="50" y2="30"/>
  </g>
  <!-- nodes -->
  <g fill="#22d3ee">
    <circle cx="50" cy="82" r="3.5"/>
    <circle cx="50" cy="55" r="3.5"/>
    <circle cx="30" cy="50" r="3.5"/>
    <circle cx="70" cy="50" r="3.5"/>
    <circle cx="18" cy="36" r="3.5"/>
    <circle cx="38" cy="33" r="3.5"/>
    <circle cx="50" cy="30" r="3.5"/>
    <circle cx="62" cy="33" r="3.5"/>
    <circle cx="82" cy="36" r="3.5"/>
  </g>
</svg>
